<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>British Values Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #222;
      line-height: 1.6;
    }

    header {
      background: #00247d;
      color: #fff;
      padding: 20px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      margin-bottom: 5px;
      font-size: 1.8rem;
    }

    nav {
      margin-top: 5px;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      margin-right: 15px;
      font-weight: bold;
      font-size: 0.95rem;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .container {
      max-width: 1000px;
      margin: 20px auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
    }

    section {
      margin-bottom: 40px;
    }

    section h2 {
      margin-bottom: 10px;
      color: #00247d;
      font-size: 1.5rem;
    }

    p {
      margin-bottom: 10px;
    }

    ul {
      margin-left: 20px;
      margin-top: 5px;
    }

    ul li {
      margin-bottom: 6px;
    }

    .values-list li strong {
      color: #00247d;
    }

    .two-column {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .two-column > div {
      flex: 1 1 280px;
    }
